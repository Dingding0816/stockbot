services:
  - type: web
    name: stockbot
    env: python
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: python fix_syntax.py && uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.16

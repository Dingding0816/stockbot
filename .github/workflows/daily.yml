name: Daily Push

permissions:
  contents: write

on:
  schedule:
    # 台灣 5:00 AM ～ 4:00 PM，每 30 分鐘
    - cron: "0 21 * * *"
    - cron: "30 21 * * *"
    - cron: "0 22 * * *"
    - cron: "30 22 * * *"
    - cron: "0 23 * * *"
    - cron: "30 23 * * *"
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"
    - cron: "0 1 * * *"
    - cron: "30 1 * * *"
    - cron: "0 2 * * *"
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
    - cron: "30 3 * * *"
    - cron: "0 4 * * *"
    - cron: "30 4 * * *"
    - cron: "0 5 * * *"
    - cron: "30 5 * * *"
    - cron: "0 6 * * *"
    - cron: "30 6 * * *"
    - cron: "0 7 * * *"
    - cron: "30 7 * * *"
    - cron: "0 8 * * *"

    # 台灣 7:30 PM ～ 1:00 AM，每 15 分鐘
    - cron: "30 11 * * *"
    - cron: "45 11 * * *"
    - cron: "0 12 * * *"
    - cron: "15 12 * * *"
    - cron: "30 12 * * *"
    - cron: "45 12 * * *"
    - cron: "0 13 * * *"
    - cron: "15 13 * * *"
    - cron: "30 13 * * *"
    - cron: "45 13 * * *"
    - cron: "0 14 * * *"
    - cron: "15 14 * * *"
    - cron: "30 14 * * *"
    - cron: "45 14 * * *"
    - cron: "0 15 * * *"
    - cron: "15 15 * * *"
    - cron: "30 15 * * *"
    - cron: "45 15 * * *"
    - cron: "0 16 * * *"
    - cron: "15 16 * * *"
    - cron: "30 16 * * *"
    - cron: "45 16 * * *"
    - cron: "0 17 * * *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run script
        run: python run_daily_new_16.py

<!DOCTYPE html>
<html>
<head>
    <title>{{ symbol }} Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #111; color: #eee; font-family: Arial; text-align: center; }
        .btn {
            display: inline-block;
            padding: 12px 20px;
            margin: 10px;
            background-color: #444;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
        }
        .btn:hover { background-color: #666; }
        #chart-container { width: 80%; margin: auto; }
    </style>
</head>
<body>
    <h1>{{ symbol }} Dashboard</h1>

    <div id="chart-container">
        <canvas id="chart"></canvas>
    </div>

    <br>
    <a href="/category/memory" class="btn">回主頁</a>

    <script>
        async function loadData() {
            const res = await fetch("/api/predict/{{ symbol }}");
            const data = await res.json();

            const ctx = document.getElementById("chart").getContext("2d");

            new Chart(ctx, {
                type: "bar",
                data: {
                    labels: ["Confidence"],
                    datasets: [{
                        label: "Prediction Confidence",
                        data: [data.prediction.confidence],
                        backgroundColor: "rgba(0, 150, 255, 0.7)"
                    }]
                }
            });
        }

        loadData();
    </script>
</body>
</html>
